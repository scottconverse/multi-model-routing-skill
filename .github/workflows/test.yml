name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: call_local.sh suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration: every defect this repo has shipped was
        # Windows-specific (CreateProcess can't exec a .sh, bash swallowing
        # backslashes, the WSL shim being the wrong bash, CRLF via autocrlf).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run call_local.sh suite
        shell: bash
        run: python3 tests/test_call_local.py

      - name: Run install.py suite
        shell: bash
        run: python3 tests/test_install.py

  lint:
    name: shell + docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck every shipped script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # every shipped script, not one by name -- same bug class as the
          # executable-bit guard below.
          shellcheck -S warning $(git ls-files 'scripts/*.sh')

      - name: every shipped script must stay executable
        run: |
          # Checking by NAME was the bug: benchmarks.sh shipped as 100644 for a
          # whole release because this guard only knew about call_local.sh.
          # Read the git index for every scripts/*.sh so a new script is
          # covered the moment it lands. The index is what a POSIX clone gets;
          # the working-tree bit is meaningless on Windows.
          fail=0
          for f in $(git ls-files 'scripts/*.sh'); do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "$f is $mode in git, expected 100755"
              echo "  fix: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          exit $fail

      - name: no CRLF in tracked text files
        run: |
          if grep -rlIU $'\r' --exclude-dir=.git . ; then
            echo "CRLF found — .gitattributes should pin the tree to LF"; exit 1
          fi
          echo "all LF"

      - name: private notes must never be committed
        run: |
          if git ls-files --error-unmatch references/local-notes.md 2>/dev/null; then
            echo "references/local-notes.md is TRACKED — it holds machine and"
            echo "account specifics and must stay git-ignored."
            exit 1
          fi
          test -f references/local-notes.example.md \
            || { echo "the template is missing"; exit 1; }
          echo "private notes correctly untracked, template present"

      - name: every referenced file exists
        run: |
          fail=0
          for f in $(grep -rhoE 'references/[a-z0-9._-]+\.md' \
                       SKILL.md README.md docs/*.md references/*.md | sort -u); do
            # local-notes.md is generated per machine, never in the repo
            [ "$f" = "references/local-notes.md" ] && continue
            [ -f "$f" ] || { echo "referenced but missing: $f"; fail=1; }
          done
          exit $fail

      - name: install.py dry run must not touch anything
        run: |
          # --project, not auto-detect: a CI runner has no ~/.claude or
          # ~/.gemini, and install.py correctly exits 1 when it finds no
          # harness. Point it at a scratch dir so we test the dry run itself.
          python3 install.py --project "$RUNNER_TEMP/probe" --list > /dev/null
          test ! -e "$RUNNER_TEMP/probe" \
            || { echo "--list created files; it must not"; exit 1; }
          git diff --exit-code

      - name: install.py real install works
        run: |
          python3 install.py --project "$RUNNER_TEMP/real" > /dev/null
          D="$RUNNER_TEMP/real/.claude/skills/multi-model-routing"
          for f in SKILL.md scripts/call_local.sh references/local-backends.md \
                   references/local-notes.md; do
            test -f "$D/$f" || { echo "install missing $f"; exit 1; }
          done
          test -x "$D/scripts/call_local.sh" \
            || { echo "installed script is not executable"; exit 1; }
          git diff --exit-code
